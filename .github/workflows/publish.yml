name: Publish to PyPI

# Runs when a GitHub release is published, or by hand from the Actions tab.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'treza-labs' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
