[project]
name = "lfx-treza"
version = "0.1.0"
description = "Treza components for Langflow: AI video and image generation and saved Treza pipelines, priced before they run."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Treza Labs, Inc.", email = "hello@trezalabs.com" }]
keywords = ["langflow", "lfx", "extension", "bundle", "treza", "ai video", "video generation", "image generation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "lfx>=1.13.0.dev0,<2.0.0",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://www.trezalabs.com/integrations/langflow"
Repository = "https://github.com/treza-labs/lfx-treza"
Issues = "https://github.com/treza-labs/lfx-treza/issues"

[project.entry-points."langflow.extensions"]
lfx-treza = "lfx_treza"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_treza"]
include = ["src/lfx_treza/extension.json", "src/lfx_treza/*.py", "src/lfx_treza/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src/lfx_treza", "tests", "README.md", "LICENSE", "pyproject.toml"]
